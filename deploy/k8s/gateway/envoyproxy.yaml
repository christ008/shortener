apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        externalTrafficPolicy: Local
