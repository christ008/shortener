apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shortener
  timeout:
    http:
      requestReceivedTimeout: 10s
      idleTimeout: 60s
  connection:
    bufferLimit: 32Ki
