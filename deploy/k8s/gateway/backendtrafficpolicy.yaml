apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: shortener
  requestBuffer:
    limit: 16Ki
  timeout:
    http:
      requestTimeout: 15s
