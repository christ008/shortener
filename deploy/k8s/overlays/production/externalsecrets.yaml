apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shortener-db
  labels:
    app.kubernetes.io/name: shortener
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: shortener-db
  dataFrom:
    - extract:
        key: shortener/db
