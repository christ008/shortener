apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shortener-db
  labels:
    app.kubernetes.io/name: shortener
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: shortener-db
  dataFrom:
    - extract:
        key: shortener/db
---
# The credentials of shortener_migrator, used by the init container that applies the migrations and by nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shortener-db-migrator
  labels:
    app.kubernetes.io/name: shortener
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: shortener-db-migrator
  dataFrom:
    - extract:
        key: shortener/db-migrator
