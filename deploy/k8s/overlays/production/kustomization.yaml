apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cluster-wide pieces are applied once per cluster, not through this overlay: Envoy Gateway itself, the GatewayClass
# in deploy/k8s/gatewayclass and a ClusterIssuer like cluster-issuer.example.yaml.
namespace: shortener
resources:
  - namespace.yaml
  - ../../base
  - ../../gateway
  - gateway.yaml
  - horizontalpodautoscaler.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
  - externalsecrets.yaml
configMapGenerator:
  - name: shortener-idp
    literals:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=https://auth.example.com/realms/shortener
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI=https://auth.example.com/realms/shortener/protocol/openid-connect/certs
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: shortener
    newName: registry.example.com/shortener
    newTag: 0.15.0
patches:
  - target:
      kind: Deployment
      name: shortener
    patch: |-
      - op: remove
        path: /spec/replicas
