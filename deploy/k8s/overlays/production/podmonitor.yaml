apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener
  podMetricsEndpoints:
    - port: management
      path: /actuator/prometheus
      interval: 15s
