apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shortener
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8081
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4318
    - ports:
        - port: 5432
    - ports:
        - port: 443
