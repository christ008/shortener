apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: shortener
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: short.example.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: short.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: shortener-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  parentRefs:
    - name: shortener
      sectionName: https
  hostnames: [short.example.com]
  rules:
    - backendRefs:
        - name: shortener
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shortener-https-redirect
  labels:
    app.kubernetes.io/name: shortener
spec:
  parentRefs:
    - name: shortener
      sectionName: http
  hostnames: [short.example.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
