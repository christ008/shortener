apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: shortener
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  parentRefs:
    - name: shortener
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms
      backendRefs:
        - name: keycloak
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shortener
          port: 80
