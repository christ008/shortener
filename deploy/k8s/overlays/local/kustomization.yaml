apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local demo on kind only. The Postgres and Keycloak here are throwaway and their credentials are public on
# purpose. Envoy Gateway must be installed first:
#   kubectl apply --server-side -f https://github.com/envoyproxy/gateway/releases/download/v1.9.2/install.yaml
# Keycloak runs in dev mode with the realm from deploy/keycloak. Its clients authenticate with signed assertions
# and get DPoP-bound tokens, so the API takes the DPoP scheme only; the dev keys are in deploy/keycloak/dev-keys.
# Call the API as the demo client with
#   TOKEN_URL=http://localhost:8088/realms/shortener/protocol/openid-connect/token \
#     java deploy/keycloak/DpopClient.java call deploy/keycloak/dev-keys/demo-client.jwk.json demo-client \
#     GET http://localhost:8088/api/short-links
resources:
  - ../../base
  - ../../../keycloak
  - ../../gatewayclass
  - ../../gateway
  - gateway.yaml
  - postgres.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: shortener-idp
    literals:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=http://localhost:8088/realms/shortener
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI=http://keycloak:8080/realms/shortener/protocol/openid-connect/certs
secretGenerator:
  - name: shortener-db
    literals:
      - url=jdbc:postgresql://postgres:5432/shortener
      - username=shortener
      - password=shortener
patches:
  - target:
      kind: EnvoyProxy
      name: shortener
    patch: |-
      - op: replace
        path: /spec/provider/kubernetes/envoyDeployment/replicas
        value: 1
      - op: add
        path: /spec/provider/kubernetes/envoyService/type
        value: NodePort
      - op: add
        path: /spec/provider/kubernetes/envoyService/patch
        value:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: 30080
  - target:
      kind: Deployment
      name: shortener
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-db
            image: postgres:18.6
            command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U shortener; do sleep 1; done"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
