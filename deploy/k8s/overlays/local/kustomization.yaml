apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local demo on kind only. The Postgres and Keycloak here are throwaway and their credentials are public on
# purpose. Keycloak runs in dev mode with the realm from deploy/keycloak; get a token for the demo client with
#   curl -s localhost:8088/realms/shortener/protocol/openid-connect/token -d grant_type=client_credentials \
#     -d client_id=demo-client -d client_secret=demo-client-secret-dev-only
resources:
  - ../../base
  - ../../../keycloak
  - ingress.yaml
  - postgres.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: shortener-idp
    literals:
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=http://localhost:8088/realms/shortener
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI=http://keycloak:8080/realms/shortener/protocol/openid-connect/certs
secretGenerator:
  - name: shortener-db
    literals:
      - url=jdbc:postgresql://postgres:5432/shortener
      - username=shortener
      - password=shortener
patches:
  - target:
      kind: Deployment
      name: shortener
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-db
            image: postgres:18.6
            command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U shortener; do sleep 1; done"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
