apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
  labels:
    app.kubernetes.io/name: shortener
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shortener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortener
    spec:
      serviceAccountName: shortener
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shortener
      initContainers:
        # Applies the migrations and exits (see MigrateOnlyRunner). It is the only container that gets the credentials
        # of shortener_migrator, which owns the tables; the application container serves requests as shortener_app,
        # which cannot change the schema, and finds nothing to apply when it starts. Flyway connects with its own
        # settings (SPRING_FLYWAY_*) so the pool's socket timeout does not cut a long migration short. The datasource
        # is only here because the context needs one to start.
        - name: migrate
          image: shortener
          imagePullPolicy: IfNotPresent
          env:
            - name: SHORTENER_MIGRATE_ONLY
              value: "true"
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: shortener-db
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shortener-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-db
                  key: password
            - name: SPRING_FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: shortener-db-migrator
                  key: url
            - name: SPRING_FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: shortener-db-migrator
                  key: username
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-db-migrator
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: shortener
          image: shortener
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: shortener-idp
            - configMapRef:
                name: shortener-telemetry
                optional: true
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: shortener-db
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shortener-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortener-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
