# Prometheus of the production stack (deploy/stack/overlays/compose.observability.yaml). The application is found through Docker's DNS:
# `shortener` resolves to the address of every task, so a scrape reaches each one and an instance that fails its health
# check drops out.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Alerts are evaluated and shown in the UI. To be told about them, point this at an Alertmanager:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager.example.com:9093']

scrape_configs:
  - job_name: shortener
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [shortener]
        type: A
        port: 8081
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
