# Unit tests of alerts.yml, with simulated series.
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - name: a pool with waiting requests fires after two minutes, and an idle one never does
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_pending{application="shortener", instance="busy"}'
        values: '0 0 3 3 3 3 3 3'
      - series: 'hikaricp_connections_pending{application="shortener", instance="idle"}'
        values: '0 0 0 0 0 0 0 0'
    promql_expr_test:
      - expr: ALERTS{alertname="ShortenerDatabasePoolExhausted", alertstate="firing"}
        eval_time: 3m
        exp_samples: []
      - expr: ALERTS{alertname="ShortenerDatabasePoolExhausted", alertstate="firing"}
        eval_time: 6m
        exp_samples:
          - labels: 'ALERTS{alertname="ShortenerDatabasePoolExhausted", alertstate="firing", instance="busy", severity="warning"}'
            value: 1

  - name: connection timeouts fire while the counter grows, and not for a counter that does not move
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_timeout_total{application="shortener", instance="failing"}'
        values: '0 0 0 5 10 15 20 25 30 35'
      - series: 'hikaricp_connections_timeout_total{application="shortener", instance="fine"}'
        values: '7 7 7 7 7 7 7 7 7 7'
    promql_expr_test:
      - expr: ALERTS{alertname="ShortenerDatabaseConnectionTimeouts", alertstate="firing"}
        eval_time: 8m
        exp_samples:
          - labels: 'ALERTS{alertname="ShortenerDatabaseConnectionTimeouts", alertstate="firing", instance="failing", severity="warning"}'
            value: 1

  - name: a slow connection fires after ten minutes above half a second, and not below it
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_acquire_seconds_max{application="shortener", instance="slow"}'
        values: '0.8+0x20'
      - series: 'hikaricp_connections_acquire_seconds_max{application="shortener", instance="quick"}'
        values: '0.01+0x20'
    promql_expr_test:
      - expr: count(ALERTS{alertname="ShortenerDatabaseSlowToConnect", alertstate="firing"})
        eval_time: 9m
        exp_samples: []
      - expr: count(ALERTS{alertname="ShortenerDatabaseSlowToConnect", alertstate="firing"})
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: 2% of requests answered 503 fires, 0.5% does not, and no traffic at all does not either
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="shortener", status="200", uri="/{shortCode}"}'
        values: '0+98x20'
      - series: 'http_server_requests_seconds_count{application="shortener", status="503", uri="/{shortCode}"}'
        values: '0+2x20'
    promql_expr_test:
      - expr: count(ALERTS{alertname="ShortenerStorageUnavailable", alertstate="firing"})
        eval_time: 4m
        exp_samples: []
      - expr: count(ALERTS{alertname="ShortenerStorageUnavailable", alertstate="firing"})
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: half a percent of 503 stays below the threshold
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="shortener", status="200"}'
        values: '0+995x20'
      - series: 'http_server_requests_seconds_count{application="shortener", status="503"}'
        values: '0+5x20'
    promql_expr_test:
      - expr: count(ALERTS{alertname="ShortenerStorageUnavailable", alertstate="firing"})
        eval_time: 15m
        exp_samples: []

  - name: no traffic is not an outage
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="shortener", status="200"}'
        values: '5+0x20'
    promql_expr_test:
      - expr: count(ALERTS{alertname="ShortenerStorageUnavailable", alertstate="firing"})
        eval_time: 15m
        exp_samples: []

  - name: redirects served from an expired entry fire after two minutes, and a cache that never needed it stays quiet
    interval: 1m
    input_series:
      - series: 'shortlink_redirect_cache_stale_total{application="shortener", instance="a"}'
        values: '0+30x12'
      - series: 'shortlink_redirect_cache_stale_total{application="shortener", instance="b"}'
        values: '0+0x12'
    promql_expr_test:
      - expr: count(ALERTS{alertname="ShortenerServingStaleRedirects", alertstate="firing"})
        eval_time: 1m
        exp_samples: []
      - expr: count(ALERTS{alertname="ShortenerServingStaleRedirects", alertstate="firing"})
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: a healthy cache serves nothing stale
    interval: 1m
    input_series:
      - series: 'shortlink_redirect_cache_stale_total{application="shortener", instance="a"}'
        values: '0+0x12'
    promql_expr_test:
      - expr: count(ALERTS{alertname="ShortenerServingStaleRedirects", alertstate="firing"})
        eval_time: 10m
        exp_samples: []

