# The production stack, for `docker stack deploy` on Swarm or `docker compose` on one host (docs/DEPLOY.md).
#
# - edge        nginx: TLS, redirect to HTTPS, limits. The only service that publishes ports.
# - shortener   the application, two instances behind the edge.
# - migrate     one-shot migrations, as the role that owns the tables. Only it holds that role's password.
# - postgres    the database. For a managed one, drop this service and point SPRING_DATASOURCE_URL and SPRING_FLYWAY_URL at it.
#
# Run from the repository root. Paths below are relative to this file, and `docker compose` reads .env from this directory, so
# give it the one at the root: `docker compose --env-file .env -f deploy/stack/compose.prod.yaml ...` (deploy/stack/deploy.sh does
# the equivalent for Swarm).
#
# Variables: deploy/stack/.env.example, described in docs/REFERENCE.md#configuration. Secrets are files (`secrets:` at the end).
# Swarm ignores some settings: docs/INTERNALS.md, "Hardening". `docker compose` honours all of them.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Defaults for every container: read-only root, no capabilities, no privilege gain.
# Writable memory uses the long `volumes:` syntax (Swarm drops the short `tmpfs:` key). There `size` is in bytes (67108864 is 64 MiB)
# and `mode` is a decimal number, so 1023 is the octal 1777: everyone may write, and the sticky bit lets only a file's owner remove it.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  init: true
  logging: *logging

# The network the edge reaches the application on. The application takes the client's address and the scheme from the edge's forwarded
# headers only when the connection comes from here (SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES below), so the subnet is fixed and this one
# value is both. It is internal: no route to or from the host, so it cannot clash with the host's or a VPN's addresses, only with another
# Docker network of the same subnet, and Docker refuses to create that.
x-ingress-subnet: &ingress-subnet 10.253.1.0/24

x-application-image: &application-image
  image: '${SHORTENER_IMAGE:-ghcr.io/christ008/shortener}:${SHORTENER_VERSION:?set SHORTENER_VERSION}'

services:
  edge:
    <<: *hardened
    image: 'nginxinc/nginx-unprivileged:1.31.5-alpine'
    user: '101:101'
    volumes:
      - {type: tmpfs, target: /tmp, tmpfs: {size: 67108864, mode: 1023}}
    ports:
      # Host mode keeps the client's address.
      - {target: 8080, published: 80, protocol: tcp, mode: host}
      - {target: 8443, published: 443, protocol: tcp, mode: host}
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
      - source: edge-upstream
        target: /etc/nginx/upstream.conf
    secrets: [tls_cert, tls_key]
    networks:
      edge: {}
      ingress: {}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 20s
    deploy:
      mode: global
      resources:
        limits: {cpus: '1', memory: 128M}
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: stop-first, parallelism: 1, failure_action: rollback}

  shortener:
    <<: [*hardened, *application-image]
    user: '1000:1000'
    volumes:
      - {type: tmpfs, target: /tmp, tmpfs: {size: 16777216, mode: 1023}}
    environment:
      SPRING_PROFILES_ACTIVE: production
      # Each file in /run/secrets is a property named like the file: spring.datasource.password.
      SPRING_CONFIG_IMPORT: 'configtree:/run/secrets/'
      SPRING_DATASOURCE_URL: '${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/shortener}'
      SPRING_DATASOURCE_USERNAME: shortener_app
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: '${ISSUER_URI:?set ISSUER_URI}'
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: '${JWKS_URI:?set JWKS_URI}'
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: '${OTLP_ENDPOINT:-http://localhost:4318/v1/traces}'
      # Hosts links may point to, comma separated. Set this, or ALLOW_ANY_TARGET=true for a private instance.
      SHORTENER_SHORTLINK_TARGETURLS_ALLOWEDHOSTS: '${ALLOWED_TARGET_HOSTS:-}'
      # The application does not start with neither.
      SHORTENER_SHORTLINK_TARGETURLS_ALLOWANY: '${ALLOW_ANY_TARGET:-false}'
      # Tunables. The defaults are the application's own (ComposeStackTest holds them equal).
      SHORTENER_SECURITY_RATELIMIT_PERIP_CAPACITY: '${RATE_LIMIT_PER_IP:-300}'
      SHORTENER_SECURITY_RATELIMIT_PERCLIENT_CAPACITY: '${RATE_LIMIT_PER_CLIENT:-60}'
      # The administrator scope is held by a person with a second factor (the `acr` claim), and by these service accounts, which have none to show.
      SHORTENER_SECURITY_ADMIN_EXEMPTCLIENTS: '${ADMIN_SERVICE_CLIENTS:-admin-client}'
      SERVER_TOMCAT_MAXCONNECTIONS: '${MAX_CONNECTIONS:-500}'
      # Forwarded headers are honoured from the edge's network alone: not from the other services, which share the data network.
      SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES: *ingress-subnet
      SHORTENER_SHORTLINK_REDIRECTCACHE_ENABLED: '${REDIRECT_CACHE_ENABLED:-true}'
      SHORTENER_SHORTLINK_REDIRECTCACHE_TTL: '${REDIRECT_CACHE_TTL:-30s}'
      SHORTENER_SHORTLINK_REDIRECTCACHE_MAXENTRIES: '${REDIRECT_CACHE_MAX_ENTRIES:-100000}'
      SHORTENER_SHORTLINK_REDIRECTCACHE_STALEIFERROR: '${REDIRECT_CACHE_STALE_IF_ERROR:-5m}'
      # Health check: Tiny Health Checker against the readiness probe.
      THC_PORT: '8081'
      THC_PATH: /actuator/health/readiness
    secrets:
      - {source: db_app_password, target: spring.datasource.password}
      # The DPoP nonce secret, the same on every instance, since a nonce made by one is checked by another.
      - {source: dpop_nonce_secret, target: shortener.security.dpop.nonce.secret}
    networks:
      ingress: {}
      data: {}
      egress: {}
    # Failures during start_period do not count. Two JVMs starting together on 2 vCPUs took 17 to 29 s (a t4g.small), and with 15 s Swarm
    # killed both as unhealthy before they were ready. A task that is ready earlier is healthy at once.
    healthcheck:
      test: ['CMD', '/workspace/health-check']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      # One DNS address per task, so the edge and Prometheus see each one. An unhealthy task drops out.
      endpoint_mode: dnsrr
      resources:
        limits: {cpus: '2', memory: 512M}
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: start-first, parallelism: 1, delay: 10s, failure_action: rollback, monitor: 20s}
      rollback_config: {order: start-first, parallelism: 1}

  migrate:
    <<: *hardened
    image: '${SHORTENER_IMAGE:-ghcr.io/christ008/shortener}:${SHORTENER_MIGRATE_VERSION:?set SHORTENER_MIGRATE_VERSION}'
    user: '1000:1000'
    volumes:
      - {type: tmpfs, target: /tmp, tmpfs: {size: 16777216, mode: 1023}}
    restart: 'no'
    environment:
      SHORTENER_MIGRATE_ONLY: 'true'
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: 'configtree:/run/secrets/'
      # Needed for the context to start. Flyway has its own connection.
      SPRING_DATASOURCE_URL: '${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/shortener}'
      SPRING_DATASOURCE_USERNAME: shortener_app
      SPRING_FLYWAY_URL: '${SPRING_FLYWAY_URL:-jdbc:postgresql://postgres:5432/shortener}'
      SPRING_FLYWAY_USER: shortener_migrator
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: '${ISSUER_URI:?set ISSUER_URI}'
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: '${JWKS_URI:?set JWKS_URI}'
      # Serves no requests, so it has no use for nonces or their secret.
      SHORTENER_SECURITY_DPOP_NONCE_ENABLED: 'false'
      # Checks no link, but the production profile does not start the context until the targets are decided.
      SHORTENER_SHORTLINK_TARGETURLS_ALLOWANY: 'true'
    secrets:
      - {source: db_app_password, target: spring.datasource.password}
      - {source: db_migrator_password, target: spring.flyway.password}
    networks: [data]
    deploy:
      mode: replicated-job
      resources:
        limits: {cpus: '2', memory: 512M}
      restart_policy: {condition: on-failure, delay: 10s, max_attempts: 5}

  postgres:
    <<: *hardened
    image: 'postgres:18.6'
    # Starts as root to prepare the data directory, then drops to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: shortener
      POSTGRES_PASSWORD_FILE: /run/secrets/db_postgres_password
      SHORTENER_APP_PASSWORD_FILE: /run/secrets/db_app_password
      SHORTENER_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      SHORTENER_EXPORTER_PASSWORD_FILE: /run/secrets/db_exporter_password
    # PostgreSQL 18 keeps its data in a versioned directory below /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
      - {type: tmpfs, target: /tmp, tmpfs: {size: 67108864, mode: 1023}}
      - {type: tmpfs, target: /var/run/postgresql, tmpfs: {size: 1048576, mode: 1023}}
      - {type: tmpfs, target: /dev/shm, tmpfs: {size: 134217728, mode: 1023}}
    configs:
      - {source: postgres-bootstrap, target: /docker-entrypoint-initdb.d/10-bootstrap.sql, mode: 0444}
      - {source: postgres-include-diagnostics, target: /docker-entrypoint-initdb.d/15-include-diagnostics.sh, mode: 0555}
      - {source: postgres-set-role-passwords, target: /docker-entrypoint-initdb.d/20-set-role-passwords.sh, mode: 0555}
      - {source: postgres-diagnostics, target: /etc/shortener/diagnostics.conf, mode: 0444}
    secrets: [db_postgres_password, db_app_password, db_migrator_password, db_exporter_password]
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shortener']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      replicas: 1
      resources:
        limits: {cpus: '2', memory: 1G}
      # The database stays on the labelled node (local disk):
      #   docker node update --label-add shortener.postgres=true <node>
      placement:
        constraints: ['node.labels.shortener.postgres == true']
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: stop-first, failure_action: rollback}

networks:
  # The edge alone, and the only network with a published port. It has a route out (Docker cannot publish a port from an internal
  # network). Nothing else is on it, and the edge shares exactly one network with each service it proxies to: Docker's DNS answers
  # with the addresses of one shared network, not necessarily the one meant, and the application trusts only the ingress subnet.
  edge: {}
  # The edge to the application, over HTTP. No route out. Encrypted between nodes (IPsec: allow UDP 4789 and ESP).
  ingress:
    internal: true
    driver_opts:
      encrypted: 'true'
    ipam:
      config:
        - subnet: *ingress-subnet
  # The application, the migration job and the database, and what the other overlays attach to them. No route out. Encrypted between nodes.
  data:
    internal: true
    driver_opts:
      encrypted: 'true'
  # The application's way out, for an identity provider that is not in the stack and for traces. Nothing else is on it, so the
  # database, the edge and Keycloak have no route out.
  egress: {}

volumes:
  postgres-data: {}

configs:
  # The name carries a hash of the file (set by deploy/stack/deploy.sh).
  nginx:
    name: 'shortener-nginx-${NGINX_CONF_HASH:-local}'
    file: ../edge/nginx.conf
  # How the edge reaches the application. The CA overlay (PKI=1) replaces the file with the one that speaks TLS.
  edge-upstream:
    name: 'shortener-edge-upstream-${EDGE_UPSTREAM_CONF_HASH:-local}'
    file: ../edge/upstream.conf
  postgres-bootstrap:
    name: 'shortener-postgres-bootstrap-${POSTGRES_CONF_HASH:-local}'
    file: ../postgres/bootstrap.sql
  postgres-include-diagnostics:
    name: 'shortener-postgres-include-diagnostics-${POSTGRES_CONF_HASH:-local}'
    file: ../postgres/include-diagnostics.sh
  postgres-set-role-passwords:
    name: 'shortener-postgres-set-role-passwords-${POSTGRES_CONF_HASH:-local}'
    file: ../postgres/set-role-passwords.sh
  postgres-diagnostics:
    name: 'shortener-postgres-diagnostics-${POSTGRES_CONF_HASH:-local}'
    file: ../postgres/diagnostics.conf

# Files under ${SECRETS_DIR} (default ./secrets, ignored by Git). deploy/stack/local/prepare.sh makes throwaway ones.
# Mode 0444: Swarm mounts them in memory at /run/secrets with the file's mode. Immutable: rotate under a new name.
# The certificate and key carry a hash of their contents in the name (deploy.sh sets TLS_HASH), so a renewed certificate is a new
# secret and a deploy replaces the edge's. They still mount at /run/secrets/tls_cert and tls_key.
secrets:
  tls_cert:
    name: 'tls_cert_${TLS_HASH:-0}'
    file: '${SECRETS_DIR:-../../secrets}/tls_cert'
  tls_key:
    name: 'tls_key_${TLS_HASH:-0}'
    file: '${SECRETS_DIR:-../../secrets}/tls_key'
  db_postgres_password:
    file: '${SECRETS_DIR:-../../secrets}/db_postgres_password'
  db_app_password:
    file: '${SECRETS_DIR:-../../secrets}/db_app_password'
  db_migrator_password:
    file: '${SECRETS_DIR:-../../secrets}/db_migrator_password'
  db_exporter_password:
    file: '${SECRETS_DIR:-../../secrets}/db_exporter_password'
  dpop_nonce_secret:
    file: '${SECRETS_DIR:-../../secrets}/dpop_nonce_secret'
