# Keycloak in production mode behind the edge, for a stack with no identity provider. Add it with a second file:
#   KEYCLOAK=1 deploy/stack/deploy.sh <version>
#   docker compose --env-file .env -f deploy/stack/compose.prod.yaml -f deploy/stack/overlays/compose.keycloak.yaml up -d
#
# - Image: built from deploy/keycloak/Dockerfile: `docker build -t shortener-keycloak:26.8.0 deploy/keycloak`. On more than one
#   node, push it to a registry (KEYCLOAK_IMAGE).
# - Database: its own, in the stack's Postgres (deploy/postgres/keycloak-database.sh), with a role only it uses. KEYCLOAK_DB_URL
#   points it elsewhere, such as the promoted replica (docs/DEPLOY.md#losing-the-primary).
# - Edge: forwards the shortener realm and its static files only (deploy/edge/keycloak.conf). Administer from the node
#   (docs/DEPLOY.md).
# - Realm: imported at the first start only. Made by `tools/run Realms production` (./gradlew productionRealm).
# - Keys: read over the stack's network (JWKS_URI=http://keycloak:8080/realms/shortener/protocol/openid-connect/certs).
#   ISSUER_URI is the public ${PUBLIC_URL}/realms/shortener.
services:
  keycloak:
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: '${KEYCLOAK_IMAGE:-shortener-keycloak}:${KEYCLOAK_VERSION:-26.8.0}'
    user: '1000:0'
    command: ['start', '--optimized', '--import-realm']
    environment:
      KC_DB_URL: '${KEYCLOAK_DB_URL:-jdbc:postgresql://postgres:5432/keycloak}'
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/db_keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      # Public address: the issuer of every token. TLS ends at the edge.
      KC_HOSTNAME: '${PUBLIC_URL:?set PUBLIC_URL, such as https://shortener.example.com}'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_CONSOLE_OUTPUT: json
      JAVA_OPTS_KC_HEAP: '-XX:MaxRAMPercentage=65'
    secrets: [db_keycloak_password, keycloak_admin_password]
    configs:
      - {source: keycloak-realm, target: /opt/keycloak/data/import/shortener-realm.json, mode: 0444}
    volumes:
      - {type: tmpfs, target: /tmp, tmpfs: {size: 67108864, mode: 1023}}
      - {type: tmpfs, target: /opt/keycloak/data/tmp, tmpfs: {size: 67108864, mode: 1023}}
    networks: [edge, data]
    healthcheck:
      # No curl in the image: a bash TCP request to the management port.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "\"UP\"" <&3']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      resources:
        limits: {cpus: '1', memory: 1G}
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: stop-first, failure_action: rollback}

  # Keycloak's database and role, created at first initialisation. For an existing database run keycloak-database.sh by hand.
  postgres:
    environment:
      SHORTENER_KEYCLOAK_PASSWORD_FILE: /run/secrets/db_keycloak_password
    configs:
      - {source: postgres-keycloak-database, target: /docker-entrypoint-initdb.d/30-keycloak-database.sh, mode: 0555}
    secrets: [db_keycloak_password]

  edge:
    configs:
      - {source: edge-keycloak, target: /etc/nginx/locations/keycloak.conf}

configs:
  # Names carry a hash of the file (set by deploy/stack/deploy.sh).
  keycloak-realm:
    name: 'shortener-keycloak-realm-${KEYCLOAK_REALM_HASH:-local}'
    file: ../keycloak/shortener-realm.production.json
  edge-keycloak:
    name: 'shortener-edge-keycloak-${EDGE_KEYCLOAK_CONF_HASH:-local}'
    file: ../edge/keycloak.conf
  postgres-keycloak-database:
    file: ../postgres/keycloak-database.sh

secrets:
  db_keycloak_password:
    file: '${SECRETS_DIR:-../../secrets}/db_keycloak_password'
  keycloak_admin_password:
    file: '${SECRETS_DIR:-../../secrets}/keycloak_admin_password'
