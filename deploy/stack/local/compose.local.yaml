# Added to compose.prod.yaml to rehearse it on one machine: the dev Keycloak with the realm, and the management port published
# on every interface for perf/smoke.sh. Not for production.
#
#   deploy/stack/local/prepare.sh     (runs deploy/keycloak/dev-setup too, if needed)
#   docker compose --env-file .env -f deploy/stack/compose.prod.yaml -f deploy/stack/local/compose.local.yaml up -d
#   JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=... perf/smoke.sh https://localhost
services:
  shortener:
    environment:
      SHORTENER_SHORTLINK_TARGETURLS_ALLOWANY: 'true'
    ports:
      - {target: 8081, published: 8081, protocol: tcp, mode: host}
    deploy:
      replicas: 1
  keycloak:
    image: 'quay.io/keycloak/keycloak:26.8.0'
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DEV_KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DEV_KEYCLOAK_ADMIN_PASSWORD:?run deploy/keycloak/dev-setup first}
      KC_HOSTNAME: http://localhost:8180
    ports:
      - {target: 8080, published: 8180, protocol: tcp, mode: host}
    volumes:
      - ../keycloak/shortener-realm.json:/opt/keycloak/data/import/shortener-realm.json:ro
    networks: [edge]
