# What the edge forwards to the app's pages when the stack has the UI (deploy/stack/overlays/compose.ui.yaml): /app and what it
# serves, and nothing else. The API keeps every other path, the short links included.
#
# Included by nginx.conf from /etc/nginx/locations/. The UI sends its own security headers and policy (ui/nginx/nginx.conf), so the
# edge adds none to these responses.

location = /app {
    absolute_redirect off;
    return 301 /app/;
}

location /app/ {
    set $ui ui;
    proxy_pass http://$ui:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Server "";
    proxy_set_header X-Forwarded-By "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
}
