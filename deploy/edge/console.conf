# The administration console of Keycloak and its master realm, at the same address as everything else (https://<host>/admin/), for the
# node itself and for nobody else. An SSH tunnel to the node's port 443 is a connection from the node: the edge publishes in host mode, so a
# client of the Internet reaches it with its own address (ComposeStackTest holds the mode), and what comes from the node reaches it from the
# gateway of docker_gwbridge, 172.18.0.1. `docker network inspect docker_gwbridge` says if the node's is another one: change it here then.
# Anyone else gets 404, as for any path nothing serves.
#
# Added with CONSOLE=1 beside KEYCLOAK=1 (docs/DEPLOY.md#the-console-through-a-tunnel, ADR 0041). Included by nginx.conf from /etc/nginx/locations/.
# keycloak.conf, which is public, names neither /admin nor the master realm, and a test holds that.

location ^~ /admin/ {
    if ($remote_addr != 172.18.0.1) {
        return 404;
    }
    set $keycloak keycloak;
    proxy_pass http://$keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Server "";
    proxy_set_header X-Forwarded-By "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location ^~ /realms/master/ {
    if ($remote_addr != 172.18.0.1) {
        return 404;
    }
    set $keycloak keycloak;
    proxy_pass http://$keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Server "";
    proxy_set_header X-Forwarded-By "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
