# What the edge forwards to Keycloak when the stack has one (deploy/stack/overlays/compose.keycloak.yaml): the shortener realm and the
# static files its pages use, nothing else. In particular not the master realm, where the administrator signs in, and not
# /admin. Those are reached from the node, with kcadm.sh, see docs/DEPLOY.md.
#
# Included by nginx.conf from /etc/nginx/locations/. The token endpoint is limited per address, because it is where a
# stranger can try keys and guess client ids; the limit zone is defined in nginx.conf.

location = /realms/shortener/protocol/openid-connect/token {
    limit_req zone=token burst=20 nodelay;
    limit_req_status 429;

    set $keycloak keycloak;
    proxy_pass http://$keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Server "";
    proxy_set_header X-Forwarded-By "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
}

# A client registers itself here, with the invitation an administrator made (Keycloak's initial access token, one use and
# a deadline): the OpenID Connect endpoint alone, which takes the client's public key and nothing else about how its tokens look,
# so the identity provider decides its scopes, its owner and its token type. Without an invitation Keycloak refuses (no trusted
# host), and the realm limits how many clients there may be (docs/DEPLOY.md#registering-a-client). The client's own endpoint,
# with the registration token it was given, rotates its key or deletes it.
location ~ ^/realms/shortener/clients-registrations/openid-connect(/[^/]+)?$ {
    limit_req zone=register burst=5 nodelay;
    limit_req_status 429;

    set $keycloak keycloak;
    proxy_pass http://$keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Server "";
    proxy_set_header X-Forwarded-By "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
}

# The other ways to register (Keycloak's own representation, which can set any attribute and choose the client id, and SAML) are not
# offered.
location ~ ^/realms/shortener/clients-registrations/ {
    return 404;
}

location ~ ^/(realms/shortener|resources)/ {
    set $keycloak keycloak;
    proxy_pass http://$keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Server "";
    proxy_set_header X-Forwarded-By "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
}
