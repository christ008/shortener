# What the edge forwards to Keycloak when the stack has one (deploy/stack/overlays/compose.keycloak.yaml): the shortener realm and the
# static files its pages use, nothing else. In particular not the master realm, where the administrator signs in, and not
# /admin. Those are reached from the node, with kcadm.sh, see docs/DEPLOY.md.
#
# Included by nginx.conf from /etc/nginx/locations/. The token endpoint is limited per address, because it is where a
# stranger can try keys and guess client ids; the limit zone is defined in nginx.conf.

location = /realms/shortener/protocol/openid-connect/token {
    limit_req zone=token burst=20 nodelay;
    limit_req_status 429;

    set $keycloak keycloak;
    proxy_pass http://$keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
}

location ~ ^/(realms/shortener|resources)/ {
    set $keycloak keycloak;
    proxy_pass http://$keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
}
