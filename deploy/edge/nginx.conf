# The edge of the production stack: terminates TLS and forwards to the application. Nothing else is exposed, and the
# management port (8081, health and metrics) is never proxied.
#
# - Runs as the unprivileged nginx user, so it listens on 8080 and 8443 and the stack publishes them as 80 and 443.
# - The certificate and key are Docker secrets, mounted at /run/secrets/tls_cert and /run/secrets/tls_key.
# - `shortener` resolves to every task of the application (its endpoint mode is dnsrr), and the resolver below looks it
#   up again every few seconds, so tasks that come and go during a rollout are followed without a reload.
# - The body cap, the timeouts and the connection cap protect Tomcat, which accepts at most 500 connections.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;

    # Temporary files go to /tmp, the only writable path of the container.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","host":"$host"}';
    access_log /dev/stdout json;

    # Docker's embedded DNS.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # What a client may send. A create request is a few hundred bytes.
    client_max_body_size 16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 60s;
    reset_timedout_connection on;

    # At most this many connections from one address. The application also limits requests per address.
    limit_conn_zone $binary_remote_addr zone=per_address:10m;
    limit_conn per_address 100;

    # The token endpoint of Keycloak, when the stack has one (deploy/edge/keycloak.conf): ten requests a second per address.
    limit_req_zone $binary_remote_addr zone=token:10m rate=10r/s;

    # The port the client used, taken from its Host header: this server listens on 8443 and the stack publishes it as 443,
    # or as another port, and a DPoP proof names the published one. Without a port in Host it is the default of https.
    map $http_host $forwarded_port {
        default 443;
        "~:(?<port>[0-9]+)$" $port;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Plain HTTP only redirects, and answers the container's own health check.
    server {
        listen 8080 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;

        add_header Strict-Transport-Security "max-age=31536000" always;

        # Locations that other parts of the stack add, such as Keycloak's. None, and nothing is included, without them.
        include /etc/nginx/locations/*.conf;

        location / {
            set $application shortener;
            proxy_pass http://$application:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # The application builds the DPoP proof's URL (scheme, host and port) and the client address from these, and
            # trusts them only from the private networks this container is on. What the client sent is replaced, not
            # appended to.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            # A task that is stopping may still be in the resolver's answer. Only requests that are safe to repeat are
            # sent to the next address.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
