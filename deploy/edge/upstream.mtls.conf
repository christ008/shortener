# How the edge reaches the application when the stack has a CA (PKI=1): TLS 1.3 with a client certificate, which the application requires
# and checks for the edge's identity (shortener.security.mtls.allowed-identities). Included by the proxy location of nginx.conf.
#
# - The certificate and key are the edge's identity, issued by deploy/stack/pki.sh. The CA is what the application's certificate must chain to.
# - The application's certificate names `shortener`, which is what the upstream group resolves to.
# - A TLS session is reused, so that the connections the upstream group keeps open do not each pay a handshake.
proxy_pass https://application;
proxy_ssl_protocols TLSv1.3;
proxy_ssl_certificate /run/secrets/mtls_cert;
proxy_ssl_certificate_key /run/secrets/mtls_key;
proxy_ssl_trusted_certificate /run/secrets/mtls_ca;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_name shortener;
proxy_ssl_server_name on;
proxy_ssl_session_reuse on;
