# Who may connect, with the stack's CA (PKI=1, deploy/stack/overlays/compose.pki.yaml). The first line that matches decides.
#
# - The application and the migration job come in over TLS with a certificate, and their identity (pg_ident.mtls.conf) is the role: they have no password to use,
#   and a connection that is not TLS, or has no certificate, is refused.
# - The other roles (the exporter, Keycloak, the superuser) keep their passwords, as before, from the stack's networks only.
local   all             all                                     trust
hostssl shortener       shortener_app,shortener_migrator  all   cert map=pki
host    shortener       shortener_app,shortener_migrator  all   reject
host    all             all             all                     scram-sha-256
