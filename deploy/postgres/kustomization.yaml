apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The initialisation scripts and the diagnostic settings of a throwaway Postgres container, in the order the image runs
# the scripts. Only the local overlay uses this; a real database is bootstrapped from bootstrap.sql by whatever
# provisions it and takes the settings of diagnostics.conf as parameters.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: postgres-init
    files:
      - 10-bootstrap.sql=bootstrap.sql
      - 15-include-diagnostics.sh=include-diagnostics.sh
      - 20-set-role-passwords.sh=set-role-passwords.sh
  - name: postgres-config
    files:
      - diagnostics.conf
