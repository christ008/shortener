# Settings that let a slow or contended database explain itself. They cost little and are meant to stay on in
# production. The server reads this file through an include added to postgresql.conf when the data directory is
# initialised (include-diagnostics.sh); a managed database takes the same settings as parameters.

# Statistics per statement (pg_stat_statements) and a plan in the log for the slowest ones (auto_explain). Both are
# libraries the server loads at start, so changing this line needs a restart.
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# Time spent reading and writing blocks, per statement and in EXPLAIN (BUFFERS). It costs a clock read per block on
# some platforms; run pg_test_timing on the target machine before keeping it there.
track_io_timing = on

# Statements slower than this go to the log, and so does their plan (without ANALYZE, which would time every node of
# every statement; run EXPLAIN (ANALYZE, BUFFERS) by hand on what shows up).
log_min_duration_statement = 250ms
auto_explain.log_min_duration = 500ms

# A wait for a lock longer than deadlock_timeout (1 s), a sort or hash that spills to disk (work_mem too small for it),
# and an autovacuum that ran for more than a second.
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s

# Who ran it: user, database and application name (shortener-<pod>, from the connection settings).
log_line_prefix = '%m [%p] %q%u@%d app=%a '
