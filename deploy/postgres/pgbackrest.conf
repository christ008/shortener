# pgBackRest for the stack's Postgres (compose.prod.postgres-ha.yaml), mounted at /etc/pgbackrest/pgbackrest.conf.
#
# The repository is a volume of the same node, which does not survive losing the node: a deployment that needs that sets
# repo1-type and its options (S3, SFTP) here, see docs/DEPLOY.md. Retention is two full backups, and the differential ones
# between them, with the WAL they need.
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
log-path=/var/lib/pgbackrest/log
log-level-console=warn
log-level-file=info
spool-path=/tmp
lock-path=/tmp/pgbackrest
start-fast=y
compress-type=zst
process-max=2

[shortener]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
