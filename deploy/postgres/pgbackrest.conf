# pgBackRest for the stack's Postgres, mounted at /etc/pgbackrest/pgbackrest.conf.
# The repository is a volume of the primary's node: set repo1-type and its options for S3 or SFTP (docs/DEPLOY.md).
# Retention: two full backups and seven differential ones.
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
log-path=/var/lib/pgbackrest/log
log-level-console=warn
log-level-file=info
spool-path=/tmp
lock-path=/tmp/pgbackrest
start-fast=y
compress-type=zst
process-max=2

[shortener]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
