services:
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
      # Passwords of the roles deploy/postgres/bootstrap.sql creates, set by set-role-passwords.sh. The application
      # run by bootRun still connects as myuser; these exist so that what compose starts has the same roles as
      # everywhere else.
      - 'SHORTENER_APP_PASSWORD=app-secret'
      - 'SHORTENER_MIGRATOR_PASSWORD=migrator-secret'
      - 'SHORTENER_EXPORTER_PASSWORD=exporter-secret'
    ports:
      - '5432'
    volumes:
      - './deploy/postgres/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro'
      - './deploy/postgres/set-role-passwords.sh:/docker-entrypoint-initdb.d/20-set-role-passwords.sh:ro'
  keycloak:
    image: 'quay.io/keycloak/keycloak:26.7.5'
    command: ['start-dev', '--import-realm']
    environment:
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
      - 'KC_HOSTNAME=http://localhost:8180'
    ports:
      - '8180:8080'
    volumes:
      - './deploy/keycloak/shortener-realm.json:/opt/keycloak/data/import/shortener-realm.json:ro'
  prometheus:
    image: 'prom/prometheus:v3.5.0'
    profiles: ['observability']
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    network_mode: host
    volumes:
      - './deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
  grafana:
    image: 'grafana/grafana:12.1.0'
    profiles: ['observability']
    environment:
      - 'GF_AUTH_ANONYMOUS_ENABLED=true'
      - 'GF_AUTH_ANONYMOUS_ORG_ROLE=Admin'
    network_mode: host
    volumes:
      - './deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro'
  tempo:
    image: 'grafana/tempo:2.8.2'
    profiles: ['observability']
    command: ['-config.file=/etc/tempo/tempo.yaml']
    network_mode: host
    tmpfs:
      - '/var/tempo:mode=1777'
    volumes:
      - './deploy/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro'
