name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: jdk17
        with:
          distribution: temurin
          java-version: '17'  # the baseline of deploy/keycloak/DpopClient.java, which DpopClientTest runs on this JDK
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run the tests (Testcontainers starts Postgres), and those of the tools
        env:
          DPOP_CLIENT_JAVA_HOME: ${{ steps.jdk17.outputs.path }}
        run: ./gradlew test
      - name: Coverage report (a measurement, not a gate)
        if: always()
        run: ./gradlew koverHtmlReport koverXmlReport -x test
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/reports/kover
      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            tools/build/reports/tests/test

  stack:
    name: Production stack and alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'  # the tools of tools/ need only 17, and dev-setup builds them with Gradle. The application needs 25, and this job does not build it
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the compose files
        run: |
          deploy/keycloak/dev-setup --yes
          docker compose --profile observability config --quiet
          cat deploy/stack/.env.example >> .env
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.prod.yaml -f deploy/stack/overlays/compose.observability.yaml config --quiet
          echo PUBLIC_URL=https://shortener.example.com >> .env
          docker compose -f compose.prod.yaml -f deploy/stack/overlays/compose.keycloak.yaml config --quiet
          docker compose -f compose.prod.yaml -f deploy/stack/overlays/compose.postgres-ha.yaml config --quiet
          docker compose -f compose.prod.yaml -f deploy/stack/local/compose.local.yaml config --quiet
      - name: Check the edge configuration
        run: |
          deploy/stack/local/prepare.sh
          docker run --rm \
            -v "$PWD/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/secrets/tls_cert:/run/secrets/tls_cert:ro" \
            -v "$PWD/secrets/tls_key:/run/secrets/tls_key:ro" \
            nginxinc/nginx-unprivileged:1.30.4-alpine nginx -t
          docker run --rm \
            -v "$PWD/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/edge/keycloak.conf:/etc/nginx/locations/keycloak.conf:ro" \
            -v "$PWD/secrets/tls_cert:/run/secrets/tls_cert:ro" \
            -v "$PWD/secrets/tls_key:/run/secrets/tls_key:ro" \
            nginxinc/nginx-unprivileged:1.30.4-alpine nginx -t
      - name: Build the Keycloak and Postgres images
        run: |
          docker build -t shortener-keycloak:ci deploy/keycloak
          docker build -t shortener-postgres:ci deploy/postgres
      - name: Check and test the alert rules
        run: |
          promtool() { docker run --rm -v "$PWD/deploy/observability:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 "$@"; }
          promtool check rules alerts.yml
          promtool test rules alerts.test.yml
      - name: Check the shell scripts
        run: |
          shellcheck --shell=sh deploy/stack/deploy.sh deploy/stack/local/prepare.sh deploy/keycloak/dev-setup deploy/keycloak/entrypoint.sh deploy/postgres/*.sh deploy/postgres/backup tools/run perf/*.sh
