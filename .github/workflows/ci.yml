name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SonarCloud needs the history to blame lines and to tell new code
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Lint (Spotless)
        run: ./gradlew spotlessCheck
      - name: Run the tests (Testcontainers starts Postgres), and those of the tools
        run: ./gradlew test
      - name: The Kotlin DPoP client passes the same suite as the Java one
        run: ./gradlew dpopJarParity -x test
      - name: Build the Kotlin DPoP client as an executable JAR
        run: ./gradlew -p tools dpopJar
      - name: Keep the DPoP client JAR, to download
        uses: actions/upload-artifact@v7
        with:
          name: dpop-client
          path: tools/build/libs/dpop.jar
      - name: Coverage report (a measurement, not a gate)
        if: always()
        run: ./gradlew koverHtmlReport koverXmlReport dpopClientReport -x test
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/reports/kover
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.node-version
      - name: "The UI: formatting, lint and types, the build, and the unit tests with their coverage (lcov, for SonarCloud)"
        working-directory: ui
        run: |
          corepack enable
          yarn install --immutable --mode=skip-build
          yarn check
          yarn build
          yarn vitest --coverage
          node scripts/lcov-for-sonar.mjs
      - name: Send the analysis and the coverage to SonarCloud
        if: success() && env.SONAR_TOKEN != ''  # a pull request from a fork has no secrets
        run: ./gradlew sonar -x test
      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            tools/build/reports/tests/test

  stack:
    name: Production stack and alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'  # the tools of tools/ need 25, as the application does (stream gatherers), and dev-setup builds them with Gradle. This job does not build the application
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Check the compose files
        run: |
          deploy/keycloak/dev-setup --yes
          docker compose --profile observability config --quiet
          cat deploy/stack/.env.example >> .env
          docker compose --env-file .env -f deploy/stack/compose.prod.yaml config --quiet
          docker compose --env-file .env -f deploy/stack/compose.prod.yaml -f deploy/stack/overlays/compose.observability.yaml config --quiet
          echo PUBLIC_URL=https://shortener.example.com >> .env
          docker compose --env-file .env -f deploy/stack/compose.prod.yaml -f deploy/stack/overlays/compose.keycloak.yaml config --quiet
          docker compose --env-file .env -f deploy/stack/compose.prod.yaml -f deploy/stack/overlays/compose.postgres-ha.yaml config --quiet
          docker compose --env-file .env -f deploy/stack/compose.prod.yaml -f deploy/stack/local/compose.local.yaml config --quiet
          # The CA and mutual TLS: the hashes that deploy.sh takes from pki.sh env are set to `ci`. `docker stack deploy` reads the files with another loader than Compose,
          # which read a dash in the message of a required variable as an operator and named three secrets the same whatever they held, so that loader checks the names too.
          for hash in CA_JSON CA_PASS CA_KEY PROVISIONER_PASS CA_CERT ROOT CHAIN EDGE_CERT EDGE_KEY SHORTENER_CERT SHORTENER_KEY SHORTENER_KEY_DER MIGRATOR_CERT MIGRATOR_KEY_DER POSTGRES_CERT POSTGRES_KEY; do
            export "PKI_${hash}_HASH=ci"
          done
          docker compose --env-file .env -f deploy/stack/compose.prod.yaml -f deploy/stack/overlays/compose.pki-ca.yaml config --quiet
          docker compose --env-file .env -f deploy/stack/compose.prod.yaml -f deploy/stack/overlays/compose.pki-ca.yaml -f deploy/stack/overlays/compose.pki-db.yaml -f deploy/stack/overlays/compose.pki.yaml config --quiet
          SHORTENER_VERSION=ci SHORTENER_MIGRATE_VERSION=ci ISSUER_URI=https://idp.example.com/realms/shortener JWKS_URI=https://idp.example.com/jwks \
            docker stack config -c deploy/stack/compose.prod.yaml -c deploy/stack/overlays/compose.pki-ca.yaml -c deploy/stack/overlays/compose.pki-db.yaml -c deploy/stack/overlays/compose.pki.yaml > "$RUNNER_TEMP/stack.yaml"
          if grep -E '^\s+name: pki_' "$RUNNER_TEMP/stack.yaml" | grep -v -E '_ci$'; then echo "a secret of the CA overlays is not named after its hash"; exit 1; fi
          test "$(grep -c -E '^\s+name: pki_.*_ci$' "$RUNNER_TEMP/stack.yaml")" = 16
      - name: Check the edge configuration
        run: |
          deploy/stack/local/prepare.sh
          docker run --rm \
            -v "$PWD/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/edge/upstream.conf:/etc/nginx/upstream.conf:ro" \
            -v "$PWD/secrets/tls_cert:/run/secrets/tls_cert:ro" \
            -v "$PWD/secrets/tls_key:/run/secrets/tls_key:ro" \
            nginxinc/nginx-unprivileged:1.30.4-alpine nginx -t
          docker run --rm \
            -v "$PWD/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/edge/upstream.conf:/etc/nginx/upstream.conf:ro" \
            -v "$PWD/deploy/edge/keycloak.conf:/etc/nginx/locations/keycloak.conf:ro" \
            -v "$PWD/secrets/tls_cert:/run/secrets/tls_cert:ro" \
            -v "$PWD/secrets/tls_key:/run/secrets/tls_key:ro" \
            nginxinc/nginx-unprivileged:1.30.4-alpine nginx -t
          # With the CA the edge speaks TLS to the application, and nginx reads its certificate, key and the CA's when it tests the file: the certificate of the test stands for all three.
          docker run --rm \
            -v "$PWD/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/edge/upstream.mtls.conf:/etc/nginx/upstream.conf:ro" \
            -v "$PWD/secrets/tls_cert:/run/secrets/tls_cert:ro" \
            -v "$PWD/secrets/tls_key:/run/secrets/tls_key:ro" \
            -v "$PWD/secrets/tls_cert:/run/secrets/mtls_cert:ro" \
            -v "$PWD/secrets/tls_key:/run/secrets/mtls_key:ro" \
            -v "$PWD/secrets/tls_cert:/run/secrets/mtls_ca:ro" \
            nginxinc/nginx-unprivileged:1.30.4-alpine nginx -t
      - name: Build the Keycloak and Postgres images
        run: |
          docker build -t shortener-keycloak:ci deploy/keycloak
          docker build -t shortener-postgres:ci deploy/postgres
      - name: Check and test the alert rules
        run: |
          promtool() { docker run --rm -v "$PWD/deploy/observability:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 "$@"; }
          promtool check rules alerts.yml
          promtool test rules alerts.test.yml
      - name: Check the shell scripts
        run: |
          shellcheck --shell=sh deploy/stack/deploy.sh deploy/stack/pki.sh deploy/stack/local/prepare.sh deploy/stack/local/prepare-pki.sh deploy/pki/ca-config deploy/keycloak/dev-setup deploy/keycloak/entrypoint.sh deploy/postgres/*.sh deploy/postgres/backup tools/run perf/*.sh perf/builds/*.sh
