name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run the tests (Testcontainers starts Postgres)
        run: ./gradlew test
      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test

  stack:
    name: Production stack and alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the compose files
        run: |
          docker compose --profile observability config --quiet
          cp deploy/stack/.env.example .env
          docker compose -f compose.prod.yaml config --quiet
          docker compose -f compose.prod.yaml -f compose.prod.observability.yaml config --quiet
          docker compose -f compose.prod.yaml -f deploy/stack/local/compose.local.yaml config --quiet
      - name: Check the edge configuration
        run: |
          deploy/stack/local/prepare.sh
          docker run --rm \
            -v "$PWD/deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/secrets/tls_cert:/run/secrets/tls_cert:ro" \
            -v "$PWD/secrets/tls_key:/run/secrets/tls_key:ro" \
            nginxinc/nginx-unprivileged:1.30.4-alpine nginx -t
      - name: Check and test the alert rules
        run: |
          promtool() { docker run --rm -v "$PWD/deploy/observability:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 "$@"; }
          promtool check rules alerts.yml
          promtool test rules alerts.test.yml
      - name: Check the shell scripts
        run: shellcheck deploy/stack/deploy.sh deploy/stack/local/prepare.sh deploy/postgres/*.sh
