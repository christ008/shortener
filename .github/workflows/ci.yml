name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the tests (Testcontainers starts Postgres)
        run: ./gradlew test
      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  manifests:
    name: Kubernetes manifests render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render every kustomization
        run: |
          for dir in deploy/k8s/overlays/local deploy/k8s/overlays/production deploy/k8s/gatewayclass deploy/keycloak; do
            echo "== $dir"
            kubectl kustomize "$dir" > /dev/null
          done
      - name: Check the compose file
        run: docker compose --profile observability config --quiet
