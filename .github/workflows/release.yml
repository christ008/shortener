name: Release

# A tag like v0.18.1 builds the image (a JVM, for arm64), smoke-tests that exact image, and only then publishes it,
# signed, with its software bill of materials. The tag must match the version in build.gradle.kts.
# It runs on an arm64 runner, the target's platform (Oracle's Ampere): what is smoke-tested is what runs there.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build, check, publish and sign
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry
      id-token: write   # keyless signing with the workflow's identity
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in the build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Run the tests (Testcontainers starts Postgres)
        run: ./gradlew test

      - name: Build the image
        run: |
          ./gradlew bootBuildImage --imageName="$IMAGE:$VERSION"
          architecture=$(docker image inspect --format '{{.Architecture}}' "$IMAGE:$VERSION")
          if [ "$architecture" != arm64 ]; then
            echo "::error::the image is $architecture, and the target is arm64 (Ampere)"
            exit 1
          fi

      - name: Start Postgres and Keycloak
        run: |
          deploy/keycloak/dev-setup --yes
          docker compose up -d postgres keycloak
          until curl -sf http://localhost:8180/realms/shortener/.well-known/openid-configuration > /dev/null; do sleep 3; done

      - name: Run the image and smoke-test every endpoint
        run: |
          perf/start-image.sh "$IMAGE:$VERSION"
          perf/smoke.sh

      - name: Show the application log when something fails
        if: failure()
        run: docker logs app

      - name: Scan the image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image that was tested
        id: push
        run: |
          docker push "$IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image by digest
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Create the software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach the bill of materials to the image
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Summarize
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            printf '### Published\n\n'
            printf '`%s:%s`\n\n' "$IMAGE" "$VERSION"
            printf 'Digest: `%s`\n\n' "$DIGEST"
            printf 'Platform: `linux/arm64`\n\n'
            printf 'Pull it:\n\n'
            printf '%s\n' '```bash' "docker pull $IMAGE@$DIGEST" '```' ''
            printf 'Verify the signature:\n\n'
            printf '%s\n' '```bash' \
              "cosign verify $IMAGE@$DIGEST \\" \
              "  --certificate-identity-regexp '^https://github.com/$REPOSITORY/' \\" \
              "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" \
              '```'
          } >> "$GITHUB_STEP_SUMMARY"

  client:
    name: Attach the Kotlin DPoP client to the release, signed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # create the release of the tag, if there is none, and attach the files to it
      id-token: write  # keyless signing of the JAR with the workflow's identity
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in the build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build the Kotlin DPoP client as an executable JAR
        run: ./gradlew -p tools dpopJar

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the JAR, and name it with its version
        run: |
          cp tools/build/libs/dpop.jar "dpop-$VERSION.jar"
          sha256sum "dpop-$VERSION.jar" > "dpop-$VERSION.jar.sha256"
          cosign sign-blob --yes --bundle "dpop-$VERSION.jar.sigstore.json" "dpop-$VERSION.jar"

      - name: Attach the files to the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "dpop-$VERSION.jar" "dpop-$VERSION.jar.sha256" "dpop-$VERSION.jar.sigstore.json" --clobber

      - name: Summarize
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            printf '### Attached to the release\n\n'
            printf '`dpop-%s.jar`, the Kotlin DPoP client, with its checksum and its signature bundle.\n\n' "$VERSION"
            printf 'Verify the signature:\n\n'
            printf '%s\n' '```bash' \
              "cosign verify-blob dpop-$VERSION.jar \\" \
              "  --bundle dpop-$VERSION.jar.sigstore.json \\" \
              "  --certificate-identity-regexp '^https://github.com/$REPOSITORY/' \\" \
              "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" \
              '```'
          } >> "$GITHUB_STEP_SUMMARY"
