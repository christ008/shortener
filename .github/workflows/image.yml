name: Image

# Builds the image, smoke-tests it and scans it on an arm64 runner, as the Release workflow does before it publishes, without publishing.
# The scan does not fail the run: it prints what the Release's scan would refuse (high or above, with a fix), so that a finding shows before a tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Build the image
        run: |
          ./gradlew bootBuildImage
          echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_ENV"
      - name: Start Postgres and Keycloak
        run: |
          deploy/keycloak/dev-setup --yes
          docker compose up -d postgres keycloak
          until curl -sf http://localhost:8180/realms/shortener/.well-known/openid-configuration > /dev/null; do sleep 3; done
      - name: Run the image
        run: perf/start-image.sh "shortener:$VERSION"
      - name: Smoke test every endpoint
        run: perf/smoke.sh
      - name: Scan the image for known vulnerabilities
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: shortener:${{ env.VERSION }}
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          json: grype-report.json
      - name: Print the findings the Release would refuse
        run: |
          jq -r '.matches[] | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | "\(.vulnerability.severity) \(.vulnerability.id) \(.artifact.name) \(.artifact.version) \(.artifact.locations | map(.path) | join(","))"' grype-report.json | sort -u
          echo "refused: $(jq '[.matches[] | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")] | length' grype-report.json)"
          echo "ignored by .grype.yaml or by the fix state: $(jq '.ignoredMatches | length' grype-report.json)"
      - name: Show the application log when something fails
        if: failure()
        run: docker logs app
