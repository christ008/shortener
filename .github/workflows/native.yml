name: Native image

# Building the image needs about 7 GB of memory and several minutes, so it runs on demand rather than on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Build and smoke-test the native image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the image
        run: ./gradlew bootBuildImage
      - name: Start Postgres and Keycloak
        run: |
          deploy/keycloak/dev-setup --yes
          docker compose up -d postgres keycloak
          until curl -sf http://localhost:8180/realms/shortener/.well-known/openid-configuration > /dev/null; do sleep 3; done
      - name: Run the image
        run: |
          perf/start-image.sh "shortener:$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)"
      - name: Smoke test every endpoint
        run: perf/smoke.sh
      - name: Show the application log when something fails
        if: failure()
        run: docker logs app
