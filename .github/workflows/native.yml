name: Native image

# Building the image needs about 7 GB of memory and several minutes, so it runs on demand rather than on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Build and smoke-test the native image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the image
        run: ./gradlew bootBuildImage
      - name: Start Postgres and Keycloak
        run: |
          docker compose up -d postgres keycloak
          until curl -sf http://localhost:8180/realms/shortener/.well-known/openid-configuration > /dev/null; do sleep 3; done
      - name: Run the image
        run: |
          port=$(docker compose port postgres 5432 | cut -d: -f2)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          docker run -d --name app --network host --memory 512m \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:$port/mydatabase \
            -e SPRING_DATASOURCE_USERNAME=myuser -e SPRING_DATASOURCE_PASSWORD=secret \
            shortener:$version
          until curl -sf http://localhost:8081/actuator/health/readiness > /dev/null; do sleep 1; done
      - name: Smoke test every endpoint
        run: perf/smoke.sh
      - name: Show the application log when something fails
        if: failure()
        run: docker logs app
