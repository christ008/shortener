# The production stack, for `docker stack deploy` on Swarm or `docker compose` on one host (docs/DEPLOY.md).
#
# - edge        nginx: TLS, redirect to HTTPS, limits. The only service that publishes ports.
# - shortener   the application, two instances behind the edge.
# - migrate     one-shot migrations, as the role that owns the tables. Only it holds that role's password.
# - postgres    the database. For a managed one, drop this service and point SPRING_DATASOURCE_URL and SPRING_FLYWAY_URL at it.
#
# Variables: deploy/stack/.env.example. Secrets are files (`secrets:` at the end).
# Swarm ignores some settings: docs/INTERNALS.md (Hardening). `docker compose` honours all of them.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Defaults for every container: read-only root, no capabilities, no privilege gain.
# Writable memory uses the long `volumes:` syntax (Swarm drops the short `tmpfs:` key).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  init: true
  logging: *logging

x-application-image: &application-image
  image: '${SHORTENER_IMAGE:-ghcr.io/christ008/shortener}:${SHORTENER_VERSION:?set SHORTENER_VERSION}'

services:
  edge:
    <<: *hardened
    image: 'nginxinc/nginx-unprivileged:1.31.5-alpine'
    user: '101:101'
    volumes:
      - {type: tmpfs, target: /tmp, tmpfs: {size: 67108864, mode: 1023}}
    ports:
      # Host mode keeps the client's address.
      - {target: 8080, published: 80, protocol: tcp, mode: host}
      - {target: 8443, published: 443, protocol: tcp, mode: host}
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
    secrets: [tls_cert, tls_key]
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 20s
    deploy:
      mode: global
      resources:
        limits: {cpus: '1', memory: 128M}
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: stop-first, parallelism: 1, failure_action: rollback}

  shortener:
    <<: [*hardened, *application-image]
    user: '1000:1000'
    volumes:
      - {type: tmpfs, target: /tmp, tmpfs: {size: 16777216, mode: 1023}}
    environment:
      SPRING_PROFILES_ACTIVE: production
      # Each file in /run/secrets is a property named like the file: spring.datasource.password.
      SPRING_CONFIG_IMPORT: 'configtree:/run/secrets/'
      SPRING_DATASOURCE_URL: '${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/shortener}'
      SPRING_DATASOURCE_USERNAME: shortener_app
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: '${ISSUER_URI:?set ISSUER_URI}'
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: '${JWKS_URI:?set JWKS_URI}'
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: '${OTLP_ENDPOINT:-http://localhost:4318/v1/traces}'
      # Hosts links may point to, comma separated. Set this, or ALLOW_ANY_TARGET=true for a private instance.
      SHORTENER_SHORTLINK_TARGETURLS_ALLOWEDHOSTS: '${ALLOWED_TARGET_HOSTS:-}'
      # The application does not start with neither.
      SHORTENER_SHORTLINK_TARGETURLS_ALLOWANY: '${ALLOW_ANY_TARGET:-false}'
      # Health check: Tiny Health Checker against the readiness probe.
      THC_PORT: '8081'
      THC_PATH: /actuator/health/readiness
    secrets:
      - {source: db_app_password, target: spring.datasource.password}
      # The DPoP nonce secret, the same on every instance, since a nonce made by one is checked by another.
      - {source: dpop_nonce_secret, target: shortener.security.dpop.nonce.secret}
    networks:
      edge: {}
      data: {}
    healthcheck:
      test: ['CMD', '/workspace/health-check']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      # One DNS address per task, so the edge and Prometheus see each one. An unhealthy task drops out.
      endpoint_mode: dnsrr
      resources:
        limits: {cpus: '2', memory: 512M}
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: start-first, parallelism: 1, delay: 10s, failure_action: rollback, monitor: 20s}
      rollback_config: {order: start-first, parallelism: 1}

  migrate:
    <<: *hardened
    image: '${SHORTENER_IMAGE:-ghcr.io/christ008/shortener}:${SHORTENER_MIGRATE_VERSION:?set SHORTENER_MIGRATE_VERSION}'
    user: '1000:1000'
    volumes:
      - {type: tmpfs, target: /tmp, tmpfs: {size: 16777216, mode: 1023}}
    restart: 'no'
    environment:
      SHORTENER_MIGRATE_ONLY: 'true'
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: 'configtree:/run/secrets/'
      # Needed for the context to start. Flyway has its own connection.
      SPRING_DATASOURCE_URL: '${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/shortener}'
      SPRING_DATASOURCE_USERNAME: shortener_app
      SPRING_FLYWAY_URL: '${SPRING_FLYWAY_URL:-jdbc:postgresql://postgres:5432/shortener}'
      SPRING_FLYWAY_USER: shortener_migrator
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: '${ISSUER_URI:?set ISSUER_URI}'
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: '${JWKS_URI:?set JWKS_URI}'
      # Serves no requests, so it has no use for nonces or their secret.
      SHORTENER_SECURITY_DPOP_NONCE_ENABLED: 'false'
    secrets:
      - {source: db_app_password, target: spring.datasource.password}
      - {source: db_migrator_password, target: spring.flyway.password}
    networks: [data]
    deploy:
      mode: replicated-job
      resources:
        limits: {cpus: '2', memory: 512M}
      restart_policy: {condition: on-failure, delay: 10s, max_attempts: 5}

  postgres:
    <<: *hardened
    image: 'postgres:18.6'
    # Starts as root to prepare the data directory, then drops to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: shortener
      POSTGRES_PASSWORD_FILE: /run/secrets/db_postgres_password
      SHORTENER_APP_PASSWORD_FILE: /run/secrets/db_app_password
      SHORTENER_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      SHORTENER_EXPORTER_PASSWORD_FILE: /run/secrets/db_exporter_password
    # PostgreSQL 18 keeps its data in a versioned directory below /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
      - {type: tmpfs, target: /tmp, tmpfs: {size: 67108864, mode: 1023}}
      - {type: tmpfs, target: /var/run/postgresql, tmpfs: {size: 1048576, mode: 1023}}
      - {type: tmpfs, target: /dev/shm, tmpfs: {size: 134217728, mode: 1023}}
    configs:
      - {source: postgres-bootstrap, target: /docker-entrypoint-initdb.d/10-bootstrap.sql, mode: 0444}
      - {source: postgres-include-diagnostics, target: /docker-entrypoint-initdb.d/15-include-diagnostics.sh, mode: 0555}
      - {source: postgres-set-role-passwords, target: /docker-entrypoint-initdb.d/20-set-role-passwords.sh, mode: 0555}
      - {source: postgres-diagnostics, target: /etc/shortener/diagnostics.conf, mode: 0444}
    secrets: [db_postgres_password, db_app_password, db_migrator_password, db_exporter_password]
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shortener']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      replicas: 1
      resources:
        limits: {cpus: '2', memory: 1G}
      # The database stays on the labelled node (local disk):
      #   docker node update --label-add shortener.postgres=true <node>
      placement:
        constraints: ['node.labels.shortener.postgres == true']
      restart_policy: {condition: any, delay: 5s}
      update_config: {order: stop-first, failure_action: rollback}

networks:
  # The edge reaches the application here, and the application reaches the identity provider. Encrypted between Swarm nodes
  # (IPsec: allow UDP 4789 and ESP).
  edge:
    driver_opts:
      encrypted: 'true'
  # The application, the migration job and the database. No route out. Encrypted between nodes.
  data:
    internal: true
    driver_opts:
      encrypted: 'true'

volumes:
  postgres-data: {}

configs:
  # The name carries a hash of the file (set by deploy/stack/deploy.sh).
  nginx:
    name: 'shortener-nginx-${NGINX_CONF_HASH:-local}'
    file: ./deploy/edge/nginx.conf
  postgres-bootstrap:
    file: ./deploy/postgres/bootstrap.sql
  postgres-include-diagnostics:
    file: ./deploy/postgres/include-diagnostics.sh
  postgres-set-role-passwords:
    file: ./deploy/postgres/set-role-passwords.sh
  postgres-diagnostics:
    file: ./deploy/postgres/diagnostics.conf

# Files under ${SECRETS_DIR} (default ./secrets, ignored by Git). deploy/stack/local/prepare.sh makes throwaway ones.
# Mode 0444: Swarm mounts them in memory at /run/secrets with the file's mode. Immutable: rotate under a new name.
secrets:
  tls_cert:
    file: '${SECRETS_DIR:-./secrets}/tls_cert'
  tls_key:
    file: '${SECRETS_DIR:-./secrets}/tls_key'
  db_postgres_password:
    file: '${SECRETS_DIR:-./secrets}/db_postgres_password'
  db_app_password:
    file: '${SECRETS_DIR:-./secrets}/db_app_password'
  db_migrator_password:
    file: '${SECRETS_DIR:-./secrets}/db_migrator_password'
  db_exporter_password:
    file: '${SECRETS_DIR:-./secrets}/db_exporter_password'
  dpop_nonce_secret:
    file: '${SECRETS_DIR:-./secrets}/dpop_nonce_secret'
