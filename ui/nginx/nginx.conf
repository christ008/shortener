# The app's pages and files, under /app. The edge forwards /app here (deploy/edge/ui.conf); nothing else is served.
# Served as the unprivileged nginx user, on 8080, with a read-only root: the caches and the pid live on tmpfs (compose.ui.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # The edge serves the app under its own name and port: a redirect must not name the port this container listens on.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /app {
        return 301 /app/;
    }

    # Hashed files: named by their content, so they can be cached for a year.
    location ^~ /app/assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Any other file, such as the favicon. A missing one is a 404, never the shell.
    location ~ ^/app/.+\.[A-Za-z0-9]+$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # A page of the app, such as /app/links: the shell, which loads the app and routes it. It is never cached, so a new build
    # is picked up at once.
    location /app/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # Every script and style in the shell gets this response's nonce, and the policy trusts nothing else. strict-dynamic
        # lets the nonced entry script load the rest, which the app creates at run time.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$request_id"';
        sub_filter '<style' '<style nonce="$request_id"';
        try_files /app/_shell.html =404;
    }
}
