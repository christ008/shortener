# Sent with every page and file of the app. The policy is the one scripts/csp.mjs writes at build time: the nonce in it is
# nginx's `$request_id`, the same value sub_filter puts on the shell's scripts and styles (nginx.conf).
include /etc/nginx/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
